def legacyMetadata = rootProject.neoforge_version ==~ /^20\.[234]\..*/

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    def clothConfigVersion = rootProject.dependencyVersion('neoforge', 'cloth_config_version')
    if (clothConfigVersion) {
        "${rootProject.modConfiguration}" "me.shedaniel.cloth:cloth-config-neoforge:${clothConfigVersion}"
    }
}

processResources {
    exclude(legacyMetadata ? 'META-INF/neoforge.mods.toml' : 'META-INF/mods.toml')
}

rootProject.registerReleaseTasks(project, [
    modrinthLoaders       : ['neoforge'],
    curseForgeLoaders     : ['NeoForge'],
    modrinthDependencies  : ['9s6osm5g': 'optional'],
    curseForgeDependencies: [optional: ['cloth-config']],
])
