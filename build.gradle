import groovy.json.JsonOutput
import net.darkhax.curseforgegradle.Constants as CurseForgeConstants
import net.darkhax.curseforgegradle.TaskPublishCurseForge

import java.net.http.HttpClient
import java.net.http.HttpRequest
import java.net.http.HttpResponse
import java.nio.charset.StandardCharsets

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        ['commonmark', 'commonmark-ext-gfm-tables', 'commonmark-ext-gfm-strikethrough', 'commonmark-ext-gfm-alerts'].each {
            classpath "org.commonmark:${it}:${commonmark_version}"
        }
    }
}

plugins {
    id 'architectury-plugin' version "${architectury_plugin_version}"
    id 'dev.architectury.loom' version "${loom_version}" apply false
    id 'dev.architectury.loom-no-remap' version "${loom_version}" apply false
    id 'com.gradleup.shadow' version "${shadow_version}" apply false
    id 'com.github.breadmoirai.github-release' version "${github_release_version}"
    id 'net.darkhax.curseforgegradle' version "${curseforge_gradle_version}" apply false
}

apply from: 'gradle/template-update.gradle'

gradle.ext.versionProperties.each { key, value -> ext.set(key as String, (value as String).trim()) }

ext.activePlatforms = gradle.ext.activePlatforms as List<String>
ext.unobfuscated = (findProperty('unobfuscated') ?: 'false').toBoolean()
ext.loomPluginId = unobfuscated ? 'dev.architectury.loom-no-remap' : 'dev.architectury.loom'
ext.modConfiguration = unobfuscated ? 'implementation' : 'modImplementation'
ext.modJarTaskName = unobfuscated ? 'shadowJar' : 'remapJar'
ext.javaVersion = java_version as int
ext.platformNames = [fabric: 'Fabric', forge: 'Forge', neoforge: 'NeoForge']

def dotenv = [:]
def dotenvFile = file('.env')
if (dotenvFile.exists()) {
    dotenvFile.eachLine('UTF-8') { line ->
        def match = line =~ /^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*?)\s*$/
        if (match.matches()) {
            dotenv[match.group(1)] = match.group(2).replaceAll(/^(['"])(.*)\1$/, '$2')
        }
    }
}

ext.secret = { String name ->
    def value = System.getenv(name) ?: dotenv[name]
    return value ? value as String : null
}

ext.dependencyVersion = { String platform, String key ->
    def value = rootProject.findProperty("${platform}_${key}")
    if (value == null) {
        value = rootProject.findProperty(key)
    }
    value = value?.toString()?.trim()
    return value ? value : null
}

ext.includeArchitecturyApi = include_architectury_api.toBoolean()

if (includeArchitecturyApi) {
    ['fabric_loader_version', 'fabric_api_version'].each { key ->
        def version = findProperty("architectury_${key}")
        if (version) {
            ext.set(key, version)
        }
    }
}

if (!(mod_environment in ['client', 'server', 'both'])) {
    throw new GradleException("mod_environment must be client, server or both (got ${mod_environment})")
}

def forgeMajor = findProperty('forge_version') ? (forge_version as String).tokenize('-')[1].tokenize('.')[0] : ''
def neoForgeMajor = findProperty('neoforge_version') ? (neoforge_version as String).replaceFirst(/-.*$/, '').tokenize('.').dropRight(1).join('.') : ''
def neoForgeParts = neoForgeMajor.tokenize('.')*.toInteger()
def neoForgeIconKey = neoForgeParts && (neoForgeParts[0] > 26 || (neoForgeParts[0] == 26 && neoForgeParts[1] >= 2)) ? 'iconFile' : 'logoFile'

ext.modProperties = [
    mod_id                 : mod_id,
    mod_name               : mod_name,
    mod_description        : mod_description,
    mod_author             : mod_author,
    mod_sources            : mod_sources,
    mod_license            : mod_license,
    mod_version            : mod_version,
    minecraft_version      : minecraft_version,
    java_version           : java_version,
    mixin_compatibility    : findProperty('mixin_compatibility') ?: "JAVA_${Math.min(javaVersion, 21)}",
    fabric_environment     : [client: 'client', server: 'server', both: '*'][mod_environment],
    fabric_loader_version  : findProperty('fabric_loader_version') ?: '',
    mod_menu_version       : findProperty('mod_menu_version') ?: '',
    forge_major            : forgeMajor,
    neoforge_major         : neoForgeMajor,
    neoforge_icon_key      : neoForgeIconKey,
    neoforge_required      : (findProperty('neoforge_version') ?: '').startsWith('20.2.') ? 'mandatory = true' : 'type = "required"',
    neoforge_optional      : (findProperty('neoforge_version') ?: '').startsWith('20.2.') ? 'mandatory = false' : 'type = "optional"',
]

architectury {
    minecraft = minecraft_version
}

allprojects {
    group = maven_group
    version = mod_version
}

subprojects {
    apply plugin: rootProject.loomPluginId
    apply plugin: 'architectury-plugin'

    base {
        archivesName = "${rootProject.archives_name}-${rootProject.minecraft_version}-${project.name}"
    }

    configurations.configureEach {
        resolutionStrategy.force "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
        resolutionStrategy.force "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    }

    repositories {
        maven {
            url = 'https://maven.shedaniel.me/'
            content { includeGroup 'me.shedaniel.cloth' }
        }
        maven {
            url = 'https://maven.architectury.dev/'
            content {
                includeGroup 'dev.architectury'
                includeGroup 'me.shedaniel'
            }
        }
        maven {
            url = 'https://maven.terraformersmc.com/releases/'
            content { includeGroup 'com.terraformersmc' }
        }
        maven { url = 'https://maven.neoforged.net/releases/' }
        maven {
            url = 'https://api.modrinth.com/maven/'
            content { includeGroup 'maven.modrinth' }
        }
    }

    if (!rootProject.unobfuscated) {
        loom {
            silentMojangMappingsLicense()
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        if (!rootProject.unobfuscated) {
            mappings loom.officialMojangMappings()
        }
    }

    def sourceVariant = rootProject.findProperty("${project.name}_sources")
    if (sourceVariant) {
        sourceSets.main.java.srcDir("src/variants/${sourceVariant}/java")
        sourceSets.main.resources.srcDir("src/variants/${sourceVariant}/resources")
    }

    java {
        withSourcesJar()
        toolchain.languageVersion = JavaLanguageVersion.of(rootProject.javaVersion)
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        if (rootProject.javaVersion > 8) {
            options.release = rootProject.javaVersion
        }
    }

    tasks.withType(JavaExec).configureEach {
        javaLauncher = javaToolchains.launcherFor(java.toolchain)
    }
}

configure(subprojects.findAll { it.name != 'common' }) { platformProject ->
    def platform = platformProject.name
    def platformName = rootProject.platformNames[platform]

    apply plugin: 'com.gradleup.shadow'

    architectury {
        platformSetupLoomIde()
        if (platform == 'neoforge') {
            neoForge()
        } else {
            "${platform}"()
        }
    }

    loom {
        accessWidenerPath = project(':common').loom.accessWidenerPath
    }

    configurations {
        common {
            canBeResolved = true
            canBeConsumed = false
        }
        compileClasspath.extendsFrom common
        if (platform != 'forge') {
            runtimeClasspath.extendsFrom common
        }
        named("development${platformName}") { extendsFrom common }

        shadowBundle {
            canBeResolved = true
            canBeConsumed = false
        }
    }

    dependencies {
        if (rootProject.unobfuscated) {
            common(project(path: ':common')) { transitive = false }
        } else {
            common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
        }
        shadowBundle project(path: ':common', configuration: "transformProduction${platformName}")

        if (rootProject.includeArchitecturyApi) {
            def architecturyVersion = rootProject.dependencyVersion(platform, 'architectury_api_version')
            if (architecturyVersion) {
                def group = rootProject.findProperty('architectury_api_group') ?: 'dev.architectury'
                add(rootProject.modConfiguration, "${group}:architectury-${platform}:${architecturyVersion}")
            } else {
                logger.warn("Architectury API is not available for ${platformName} on Minecraft ${rootProject.minecraft_version}, skipping")
            }
        }
    }

    def clothConfigVersion = rootProject.dependencyVersion(platform, 'cloth_config_version') ?: ''
    def clothConfigMajor = clothConfigVersion ? clothConfigVersion.tokenize('.')[0] as int : 0
    def resourceProperties = rootProject.modProperties + [
        architectury_api_version: rootProject.includeArchitecturyApi ? (rootProject.dependencyVersion(platform, 'architectury_api_version') ?: '') : '',
        cloth_config_version    : clothConfigVersion,
        cloth_config_id         : platform == 'fabric' ? (clothConfigMajor < 6 ? 'cloth-config2' : 'cloth-config') : (clothConfigMajor < 5 ? 'cloth-config' : 'cloth_config'),
    ]

    processResources {
        inputs.properties(resourceProperties)
        filesMatching(['fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
            expand(resourceProperties)
        }
    }

    if (rootProject.unobfuscated) {
        jar {
            archiveClassifier = 'dev'
        }

        shadowJar {
            configurations = [project.configurations.shadowBundle]
            archiveClassifier = null
        }

        tasks.named('assemble') { dependsOn tasks.named('shadowJar') }

        configurations {
            apiElements {
                outgoing.artifacts.clear()
                outgoing.artifact(tasks.named('shadowJar'))
            }
            runtimeElements {
                outgoing.artifacts.clear()
                outgoing.artifact(tasks.named('shadowJar'))
            }
        }
    } else {
        shadowJar {
            configurations = [project.configurations.shadowBundle]
            archiveClassifier = 'dev-shadow'
        }

        remapJar {
            inputFile.set(shadowJar.archiveFile)
        }
    }
}

configure(subprojects.findAll { it.name in ['forge', 'neoforge'] }) {
    def generatePackMetadata = tasks.register('generatePackMetadata') {
        def format = rootProject.pack_format as int
        def description = "${rootProject.mod_name} resources"
        def outputDir = layout.buildDirectory.dir('generated/packMetadata')

        inputs.property('format', format)
        inputs.property('description', description)
        outputs.dir(outputDir)

        doLast {
            def pack = [description: description]
            if (format >= 65) {
                pack.min_format = format
                pack.max_format = format
            } else {
                pack.pack_format = format
            }
            def output = outputDir.get().file('pack.mcmeta').asFile
            output.parentFile.mkdirs()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson([pack: pack])) + '\n'
        }
    }

    processResources {
        from(generatePackMetadata)
    }

    def accessWidenerName = "${rootProject.mod_id}.accesswidener"
    loom {
        if (project.name == 'neoforge') {
            neoForge {
                convertAccessWideners(tasks.named(rootProject.modJarTaskName), accessWidenerName)
            }
        } else if (rootProject.unobfuscated) {
            forge {
                convertAccessWideners(tasks.named(rootProject.modJarTaskName), accessWidenerName)
            }
        } else {
            forge {
                convertAccessWideners = true
                extraAccessWideners.add(accessWidenerName)
            }
        }
    }
}

ext.registerReleaseTasks = { Project platformProject, Map config ->
    def platformName = platformNames[platformProject.name]
    def releaseName = "${mod_version}+${minecraft_version}-${platformName}"
    def jarTask = platformProject.tasks.named(modJarTaskName)

    def modrinthDependencies = new LinkedHashMap(config.modrinthDependencies ?: [:])
    def curseForgeDependencies = (config.curseForgeDependencies ?: [:]).collectEntries { type, slugs -> [type, new ArrayList(slugs)] }
    if (includeArchitecturyApi && dependencyVersion(platformProject.name, 'architectury_api_version')) {
        modrinthDependencies['lhGA9TYQ'] = 'required'
        curseForgeDependencies.computeIfAbsent('required') { [] } << 'architectury-api'
    }

    platformProject.tasks.register('modrinth') {
        group = 'publishing'
        description = "Uploads the ${platformName} jar to Modrinth"
        dependsOn(jarTask)

        doLast {
            def token = secret('MODRINTH_TOKEN')
            if (!token) {
                throw new GradleException('MODRINTH_TOKEN is not set, add it to .env or the environment')
            }

            def jarFile = jarTask.get().archiveFile.get().asFile
            def metadata = JsonOutput.toJson([
                name          : releaseName,
                version_number: releaseName,
                project_id    : modrinth_id,
                game_versions : [minecraft_version],
                loaders       : config.modrinthLoaders,
                featured      : true,
                version_type  : release_type,
                status        : 'listed',
                changelog     : rootProject.file('CHANGELOG.md').getText('UTF-8'),
                dependencies  : modrinthDependencies.collect { id, type -> [project_id: id, dependency_type: type] },
                environment   : [client: 'client_only', server: 'server_only', both: 'client_and_server'][mod_environment],
                file_parts    : ['mod_file'],
                primary_file  : 'mod_file',
            ])

            def boundary = "----${UUID.randomUUID()}"
            def body = new ByteArrayOutputStream()
            def write = { String text -> body.write(text.getBytes(StandardCharsets.UTF_8)) }
            write("--${boundary}\r\nContent-Disposition: form-data; name=\"data\"\r\nContent-Type: application/json\r\n\r\n${metadata}\r\n")
            write("--${boundary}\r\nContent-Disposition: form-data; name=\"mod_file\"; filename=\"${jarFile.name}\"\r\nContent-Type: application/java-archive\r\n\r\n")
            body.write(jarFile.bytes)
            write("\r\n--${boundary}--\r\n")

            def request = HttpRequest.newBuilder(URI.create('https://api.modrinth.com/v2/version'))
                .header('Authorization', token)
                .header('Content-Type', "multipart/form-data; boundary=${boundary}")
                .header('User-Agent', "${repo_owner}/${repo_name}/${mod_version}")
                .POST(HttpRequest.BodyPublishers.ofByteArray(body.toByteArray()))
                .build()
            def response = HttpClient.newHttpClient().send(request, HttpResponse.BodyHandlers.ofString())
            if (response.statusCode() != 200) {
                throw new GradleException("Modrinth upload failed (${response.statusCode()}): ${response.body()}")
            }
            logger.lifecycle("Published ${releaseName} to Modrinth")
        }
    }

    platformProject.tasks.register('curseForge', TaskPublishCurseForge) {
        group = 'publishing'
        description = "Uploads the ${platformName} jar to CurseForge"
        dependsOn(jarTask)

        apiToken = secret('CURSEFORGE_TOKEN')

        def mainFile = upload(curseforge_id as Integer, jarTask)
        mainFile.displayName = releaseName
        mainFile.changelog = rootProject.file('CHANGELOG.md').getText('UTF-8')
        mainFile.changelogType = 'markdown'
        mainFile.releaseType = [
            release: CurseForgeConstants.RELEASE_TYPE_RELEASE,
            beta   : CurseForgeConstants.RELEASE_TYPE_BETA,
            alpha  : CurseForgeConstants.RELEASE_TYPE_ALPHA,
        ][release_type]
        mainFile.addGameVersion(minecraft_version)
        mainFile.addJavaVersion("Java ${javaVersion}")
        config.curseForgeLoaders.each { mainFile.addModLoader(it) }
        if (mod_environment in ['client', 'both']) {
            mainFile.addEnvironment('Client')
        }
        if (mod_environment in ['server', 'both']) {
            mainFile.addEnvironment('Server')
        }
        curseForgeDependencies.each { type, slugs ->
            slugs.each { slug ->
                switch (type) {
                    case 'required': mainFile.addRequirement(slug); break
                    case 'optional': mainFile.addOptional(slug); break
                    case 'embedded': mainFile.addEmbedded(slug); break
                    case 'incompatible': mainFile.addIncompatibility(slug); break
                }
            }
        }

        doFirst {
            if (!apiToken) {
                throw new GradleException('CURSEFORGE_TOKEN is not set, add it to .env or the environment')
            }
        }
    }
}

githubRelease {
    token = providers.provider { secret('GITHUB_TOKEN') ?: '' }
    owner = repo_owner
    repo = repo_name
    tagName = "${mod_version}+${minecraft_version}"
    targetCommitish = repo_branch
    releaseName = "${mod_name} v${mod_version}+${minecraft_version}"
    body = providers.provider { file('CHANGELOG.md').getText('UTF-8') }
    prerelease = release_type != 'release'
    releaseAssets.from(providers.provider { activePlatforms.collect { project(":${it}").tasks.getByName(modJarTaskName) } })
}

tasks.named('githubRelease') {
    dependsOn(activePlatforms.collect { ":${it}:${modJarTaskName}" })
    doFirst {
        if (!secret('GITHUB_TOKEN')) {
            throw new GradleException('GITHUB_TOKEN is not set, add it to .env or the environment')
        }
    }
}

tasks.register('publishMod') {
    group = 'publishing'
    description = 'Creates the GitHub release and uploads every platform jar to Modrinth and CurseForge'
    dependsOn('githubRelease')
    dependsOn(activePlatforms.collectMany { [":${it}:modrinth", ":${it}:curseForge"] })
}

tasks.register('syncReadme') {
    group = 'publishing'
    description = 'Pushes README.md to the Modrinth and CurseForge project descriptions'

    doLast {
        def readme = file('README.md').getText('UTF-8').replace('\r\n', '\n')
        def client = HttpClient.newHttpClient()
        def synced = false

        def modrinthToken = secret('MODRINTH_TOKEN')
        if (modrinthToken) {
            def request = HttpRequest.newBuilder(URI.create("https://api.modrinth.com/v2/project/${modrinth_id}"))
                .header('Authorization', modrinthToken)
                .header('Content-Type', 'application/json')
                .header('User-Agent', "${repo_owner}/${repo_name}/${mod_version}")
                .method('PATCH', HttpRequest.BodyPublishers.ofString(JsonOutput.toJson([body: readme])))
                .build()
            def response = client.send(request, HttpResponse.BodyHandlers.ofString())
            if (response.statusCode() != 204) {
                throw new GradleException("Modrinth README sync failed (${response.statusCode()}): ${response.body()}")
            }
            logger.lifecycle('Synced README to Modrinth')
            synced = true
        } else {
            logger.warn('MODRINTH_TOKEN is not set, skipping Modrinth')
        }

        def curseForgeSession = secret('CURSEFORGE_SESSION_COOKIE')
        def curseForgeAuthors = secret('CURSEFORGE_AUTHORS_USER')
        if (curseForgeSession && curseForgeAuthors) {
            def extensions = [
                org.commonmark.ext.gfm.tables.TablesExtension.create(),
                org.commonmark.ext.gfm.strikethrough.StrikethroughExtension.create(),
                org.commonmark.ext.gfm.alerts.AlertsExtension.create(),
            ]
            def parser = org.commonmark.parser.Parser.builder().extensions(extensions).build()
            def renderer = org.commonmark.renderer.html.HtmlRenderer.builder().extensions(extensions).build()
            def html = renderer.render(parser.parse(readme))

            def request = HttpRequest.newBuilder(URI.create("https://authors.curseforge.com/_api/projects/description/${curseforge_id}"))
                .header('Cookie', "CobaltSession=${curseForgeSession}; AuthorsUser=${curseForgeAuthors}")
                .header('Content-Type', 'application/json')
                .PUT(HttpRequest.BodyPublishers.ofString(JsonOutput.toJson([description: html, descriptionType: 1])))
                .build()
            def response = client.send(request, HttpResponse.BodyHandlers.ofString())
            if (response.statusCode() != 200) {
                throw new GradleException("CurseForge README sync failed (${response.statusCode()}): ${response.body()}")
            }
            logger.lifecycle('Synced README to CurseForge')
            synced = true
        } else {
            logger.warn('CURSEFORGE_SESSION_COOKIE or CURSEFORGE_AUTHORS_USER is not set, skipping CurseForge')
        }

        if (!synced) {
            throw new GradleException('No publishing credentials found, nothing was synced')
        }
    }
}
