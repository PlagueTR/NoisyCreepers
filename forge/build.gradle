loom {
    forge {
        mixinConfig "${rootProject.mod_id}.mixins.json"
    }
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.forge_version}"

    def clothConfigVersion = rootProject.dependencyVersion('forge', 'cloth_config_version')
    if (clothConfigVersion) {
        "${rootProject.modConfiguration}" "me.shedaniel.cloth:cloth-config-forge:${clothConfigVersion}"
    }

    def modsButtonVersion = rootProject.dependencyVersion('forge', 'mods_button_version')
    if (modsButtonVersion) {
        modLocalRuntime "maven.modrinth:gamemenumodoption:${modsButtonVersion}"
    }
}

if (rootProject.modProperties.forge_major in ['50', '51']) {
    configurations.runtimeClasspath.resolutionStrategy.force 'net.sf.jopt-simple:jopt-simple:5.0.4'
}

tasks.withType(Jar).configureEach {
    manifest.attributes('MixinConfigs': "${rootProject.mod_id}.mixins.json")
}

rootProject.registerReleaseTasks(project, [
    modrinthLoaders       : ['forge'],
    curseForgeLoaders     : ['Forge'],
    modrinthDependencies  : rootProject.dependencyVersion('forge', 'cloth_config_version') ? ['9s6osm5g': 'optional'] : [:],
    curseForgeDependencies: rootProject.dependencyVersion('forge', 'cloth_config_version') ? [optional: ['cloth-config']] : [:],
])
