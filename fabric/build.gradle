dependencies {
    "${rootProject.modConfiguration}" "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    "${rootProject.modConfiguration}" "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    def clothConfigVersion = rootProject.dependencyVersion('fabric', 'cloth_config_version')
    if (clothConfigVersion) {
        "${rootProject.modConfiguration}"("me.shedaniel.cloth:cloth-config-fabric:${clothConfigVersion}") {
            exclude group: 'net.fabricmc.fabric-api'
        }
    }

    "${rootProject.modConfiguration}"("com.terraformersmc:modmenu:${rootProject.mod_menu_version}") {
        transitive = false
    }
}

rootProject.registerReleaseTasks(project, [
    modrinthLoaders       : ['fabric', 'quilt'],
    curseForgeLoaders     : ['Fabric', 'Quilt'],
    modrinthDependencies  : ['mOgUt4GM': 'optional', '9s6osm5g': 'optional'],
    curseForgeDependencies: [optional: ['modmenu', 'cloth-config']],
])

processResources {
    from(project(':common').loom.accessWidenerPath)
}
